name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: WhatsApp message filtering
        run: node --test moha_mind/whatsapp_bot/bridge/policy.test.mjs

      - name: WhatsApp bridge syntax
        run: node --check moha_mind/whatsapp_bot/bridge/bridge.mjs
